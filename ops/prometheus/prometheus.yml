# Prometheus scrape-конфиг (Phase 8: Observability).
# Снимает метрики с FastAPI-бэкенда (/metrics, prometheus_fastapi_instrumentator
# + кастомные бизнес-метрики prototip_*).
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: prototip-bi

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: prototip-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend
