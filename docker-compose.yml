# ─────────────────────────────────────────────────────────────────────────────
#  Prototip BI — оркестрация всего стека
#
#  Папки-сервисы:
#    frontend/  — React + Vite + nginx
#    backend/   — FastAPI API + LangGraph-агенты (in-process)
#    db/        — ClickHouse (+ init.sql); векторное хранилище — Qdrant
#
#  Запуск ядра (frontend + backend + базы + LLM):
#    docker compose up -d --build
#
#  Опциональные профили:
#    docker compose --profile auth up -d            # Keycloak
#    docker compose --profile etl  up -d            # Postgres + Airflow (ETL)
#    docker compose --profile observability up -d   # Prometheus + Grafana (Phase 8)
#       Grafana   → http://localhost:3001  (admin/admin, см. GRAFANA_* в .env)
#       Prometheus→ http://localhost:9090
#
#  Каждый сервис можно поднять отдельно, напр.:
#    docker compose up -d clickhouse qdrant minio
#    docker compose up -d backend
#    docker compose up -d frontend
# ─────────────────────────────────────────────────────────────────────────────
services:
  # ===================== БАЗЫ ДАННЫХ =====================
  clickhouse:
    build:
      context: ./db
      dockerfile: Dockerfile
    image: prototip-clickhouse:latest
    container_name: genbi_clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      - CLICKHOUSE_DB=genbi
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
      - CLICKHOUSE_PASSWORD=
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    container_name: genbi_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  # ===================== ОБЪЕКТНОЕ ХРАНИЛИЩЕ (Phase 1) =====================
  minio:
    image: minio/minio:latest
    container_name: genbi_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9100:9000"   # S3 API (хост 9100, т.к. 9000 занят ClickHouse)
      - "9101:9001"   # Веб-консоль MinIO
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Одноразовый сервис: создаёт бакеты при старте
  minio-init:
    image: minio/mc:latest
    container_name: genbi_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin} &&
      mc mb -p local/artifacts &&
      mc mb -p local/templates &&
      echo 'MinIO buckets ready' || exit 0
      "
    restart: "no"

  # ===================== LLM (Ollama) =====================
  ollama:
    image: ollama/ollama:latest
    container_name: genbi_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  # ===================== BACKEND (FastAPI + LangGraph) =====================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: prototip-backend:latest
    container_name: genbi_backend
    ports:
      - "8000:8000"
    depends_on:
      clickhouse:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_started
      ollama:
        condition: service_started
    environment:
      # ClickHouse
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_DB=genbi
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      # LLM (Ollama по умолчанию; для Vertex выставить USE_VERTEX=true)
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5-coder:7b-instruct}
      - USE_VERTEX=${USE_VERTEX:-false}
      # Vertex / Gemini (используется при USE_VERTEX=true)
      - AI_MODEL=${AI_MODEL:-gemini-3.5-flash}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/gcp.json}
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-}
      - GOOGLE_CLOUD_LOCATION=${GOOGLE_CLOUD_LOCATION:-global}
      # Векторное хранилище
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      # Объектное хранилище (Phase 1)
      - STORAGE_BACKEND=${STORAGE_BACKEND:-minio}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=false
      - MINIO_BUCKET=artifacts
      - MINIO_PUBLIC_URL=${MINIO_PUBLIC_URL:-http://localhost:9100}
      # Долгосрочная память (Phase 4)
      - MEMORY_ENABLED=${MEMORY_ENABLED:-true}
      - MEMORY_RAG_DAYS=${MEMORY_RAG_DAYS:-7}
      - MEMORY_RAG_TOPK=${MEMORY_RAG_TOPK:-5}
    volumes:
      - backend_out:/app/out
      # Ключ сервис-аккаунта GCP для Vertex (положите backend/secrets/gcp.json; read-only)
      - ./backend/secrets:/app/secrets:ro

  # ===================== FRONTEND (React + Vite + nginx) =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: prototip-frontend:latest
    container_name: genbi_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  # ===================== AUTH (опционально) =====================
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: genbi_keycloak
    command: start-dev
    profiles: ["auth"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"

  # ===================== ETL: Postgres + Airflow (опционально) =====================
  postgres:
    image: postgres:13
    container_name: genbi_postgres
    profiles: ["etl"]
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow-webserver:
    image: apache/airflow:2.9.1
    container_name: airflow_webserver
    profiles: ["etl"]
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - _AIRFLOW_DB_UPGRADE=True
      - _AIRFLOW_WWW_USER_CREATE=True
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
    ports:
      - "8081:8080"
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/logs:/opt/airflow/logs
      - ./backend/airflow/plugins:/opt/airflow/plugins
    command: webserver

  airflow-scheduler:
    image: apache/airflow:2.9.1
    container_name: airflow_scheduler
    profiles: ["etl"]
    restart: always
    depends_on:
      - postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    volumes:
      - ./backend/airflow/dags:/opt/airflow/dags
      - ./backend/airflow/logs:/opt/airflow/logs
      - ./backend/airflow/plugins:/opt/airflow/plugins
    command: scheduler

  # ===================== OBSERVABILITY: Prometheus + Grafana (Phase 8) =====
  # Запуск: docker compose --profile observability up -d
  prometheus:
    image: prom/prometheus:latest
    container_name: genbi_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "9090:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: genbi_grafana
    profiles: ["observability"]
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SECURITY_ALLOW_EMBEDDING=true            # для iframe-встраивания в админке
      - GF_AUTH_ANONYMOUS_ENABLED=true              # просмотр дашбордов без логина (iframe)
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  clickhouse_data:
  qdrant_data:
  postgres_data:
  minio_data:
  ollama_data:
  backend_out:
  prometheus_data:
  grafana_data:
