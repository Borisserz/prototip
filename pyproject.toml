[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
    "live: tests requiring local Ollama model",
]

[tool.coverage.run]
source = ["app", "core", "viz", "ui"]
omit = ["tests/*", "ui/streamlit_app.py"]

[tool.coverage.report]
fail_under = 60
show_missing = true
