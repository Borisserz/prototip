[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# F (pyflakes/корректность) и I (сортировка импортов) — обязательны.
# Ниже — технический долг для ПОСТЕПЕННОГО внедрения (не блокирует CI):
ignore = [
    "E501",   # длина строки
    "B008",   # FastAPI idiom: Depends()/File()/Body() в дефолтах аргументов — ложное срабатывание
    "E402",   # ленивые импорты внутри модулей (осознанно по всему проекту)
    "B904",   # raise ... from внутри except — TODO: добавить цепочку исключений
    "B007",   # неиспользуемая переменная цикла
    "B023",   # замыкание над переменной цикла — TODO: проверить стриминг
    "B905",   # zip(strict=) 
    # E722 (bare except) включён обратно в гейт — P1-1: голые except запрещены.
    "E701",   # несколько операторов в строке
    "E741",   # неоднозначное имя переменной
    "SIM102", "SIM105", "SIM108",  # стилистические упрощения
    "UP042", "UP045",  # модернизация typing — TODO: X | None
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
    "live: tests requiring local Ollama model",
]

[tool.coverage.run]
source = ["app", "core", "viz"]
omit = ["tests/*"]

[tool.coverage.report]
fail_under = 60
show_missing = true
