# ─────────────────────────────────────────────────────────────────────────────
#  RLS (Row-Level Security): маппинг роль → разрешённые значения фильтров.
#
#  ЭТО ЕДИНЫЙ ИСТОЧНИК ПРАВДЫ для построчной изоляции по ролям.
#  Заменяет жёстко зашитый маппинг, который раньше дублировался в
#  app/agents/data_agent.py и app/crew/tools.py (P0: "г. Гродно" не совпадал
#  с фактическим значением "Гродненская область" → 0 строк → 500).
#
#  ВАЖНО: значения здесь ДОЛЖНЫ совпадать с фактическими значениями в DWH
#  (колонка region в default.enterprise_taxes). Сейчас это названия областей
#  + город Минск. Для роли указывается СЕМЕЙСТВО значений (list) — фильтр
#  применяется как `region IN (...)`, поэтому менеджер видит и область, и
#  относящиеся к ней города.
#
#  РОЛЬ БЕЗ ОГРАНИЧЕНИЙ: если роли нет в этом файле (напр. admin / manager) —
#  фильтр не накладывается, пользователь видит все данные.
#
#  РОАДМАП: этот YAML — промежуточный слой. Структура совместима с переносом
#  в таблицу БД (default.rls_role_filters), которую админ редактирует из
#  интерфейса при создании "блока" (tenant) и назначении пользователей.
#  Loader (core/rls.py) можно переключить на чтение из БД без изменения
#  вызывающего кода.
# ─────────────────────────────────────────────────────────────────────────────

roles:
  grodno_manager:
    region:
      - "Гродненская область"
      - "г. Гродно"
  minsk_manager:
    region:
      - "Минская область"
      - "г. Минск"
