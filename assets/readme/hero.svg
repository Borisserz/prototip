<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Prototip BI</title>
  <desc id="desc">Multi-tenant BI platform that turns natural-language questions into SQL, charts, and reports on ClickHouse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0D10"/>
      <stop offset="55%" stop-color="#12151C"/>
      <stop offset="100%" stop-color="#0E1116"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#FFE566"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFE566"/>
      <stop offset="100%" stop-color="#F0B429"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="26.5" fill="none" stroke="#2A303A" stroke-width="1.5"/>

  <g transform="translate(56 48)">
    <text x="0" y="18" fill="#8B93A7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" letter-spacing="2.4">MULTI-TENANT BI  |  TEXT-TO-SQL</text>
    <text x="0" y="78" fill="#F4F6FA" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="54" font-weight="750">Prototip</text>
    <text x="0" y="124" fill="#A7B0C0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">Ask in plain language. Get SQL, charts,</text>
    <text x="0" y="156" fill="#A7B0C0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="23" font-weight="500">dashboards, and exportable reports.</text>

    <g transform="translate(0 196)">
      <rect width="128" height="36" rx="18" fill="#1A1F28"/>
      <text x="64" y="24" text-anchor="middle" fill="#E8ECF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">LangGraph</text>
      <rect x="140" width="138" height="36" rx="18" fill="#1A1F28"/>
      <text x="209" y="24" text-anchor="middle" fill="#E8ECF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">ClickHouse</text>
      <rect x="290" width="108" height="36" rx="18" fill="#1A1F28"/>
      <text x="344" y="24" text-anchor="middle" fill="#E8ECF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">FastAPI</text>
      <rect x="410" width="100" height="36" rx="18" fill="#1A1F28"/>
      <text x="460" y="24" text-anchor="middle" fill="#E8ECF1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="15" font-weight="650">React</text>
    </g>
  </g>

  <!-- pipeline card -->
  <g transform="translate(740 40)">
    <rect width="404" height="280" rx="24" fill="#14181F" stroke="#2A303A" stroke-width="1.5"/>

    <text x="24" y="36" fill="#8B93A7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="650" letter-spacing="1.6">PIPELINE</text>

    <!-- prompt chip -->
    <rect x="24" y="56" width="356" height="44" rx="12" fill="#0F1319" stroke="#2E3642"/>
    <text x="40" y="84" fill="#FFE566" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="600">"Debt by region, 2024"</text>

    <!-- steps -->
    <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="14" font-weight="650">
      <rect x="24" y="118" width="100" height="34" rx="17" fill="#1A1F28"/>
      <text x="74" y="140" text-anchor="middle" fill="#D7DEEA">Parse</text>
      <path d="M132 135 H152" stroke="#3A4454" stroke-width="2"/>
      <rect x="152" y="118" width="100" height="34" rx="17" fill="#1A1F28"/>
      <text x="202" y="140" text-anchor="middle" fill="#D7DEEA">SQL</text>
      <path d="M260 135 H280" stroke="#3A4454" stroke-width="2"/>
      <rect x="280" y="118" width="100" height="34" rx="17" fill="#1A1F28"/>
      <text x="330" y="140" text-anchor="middle" fill="#D7DEEA">Chart</text>
    </g>

    <!-- mini chart -->
    <g transform="translate(48 178)">
      <rect x="0" y="48" width="28" height="40" rx="4" fill="url(#bar)" opacity="0.55"/>
      <rect x="44" y="28" width="28" height="60" rx="4" fill="url(#bar)" opacity="0.75"/>
      <rect x="88" y="12" width="28" height="76" rx="4" fill="url(#bar)"/>
      <rect x="132" y="36" width="28" height="52" rx="4" fill="url(#bar)" opacity="0.7"/>
      <rect x="176" y="20" width="28" height="68" rx="4" fill="url(#bar)" opacity="0.85"/>
      <rect x="220" y="44" width="28" height="44" rx="4" fill="url(#bar)" opacity="0.5"/>
      <line x1="0" y1="92" x2="260" y2="92" stroke="#2E3642" stroke-width="1.5"/>
      <text x="280" y="56" fill="#8B93A7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="600">+ PPTX / DOCX</text>
    </g>

    <rect x="24" y="232" width="356" height="28" rx="8" fill="#0F1319"/>
    <rect x="24" y="232" width="220" height="28" rx="8" fill="url(#accent)" opacity="0.9"/>
    <text x="202" y="251" text-anchor="middle" fill="#1A1400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" font-weight="700">ClickHouse  ·  SQL guard  ·  RAG</text>
  </g>
</svg>
